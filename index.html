<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ? </title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Текст будет белым и красивым */
        h1 {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 3rem;
            text-align: center;
            animation: fadeInOut 4s ease-in-out infinite alternate;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.8);
            }
        }
    </style>
</head>
<body>
    <h1>Текст в центре экрана</h1> <!-- Убрал лишний символ -->
</body>
</html>
