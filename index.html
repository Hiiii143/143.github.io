<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ? </title>
    <style>
        /* Подключаем шрифт из файла */
        @font-face {
            font-family: 'MyCustomFont'; /* Название шрифта */
            src: url('OMORI_GAME2.ttf') format('truetype'); /* Укажи путь к файлу */
            /* Для .otf: src: url('шрифт.otf') format('opentype'); */
            /* Для .woff: src: url('шрифт.woff') format('woff'); */
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: black;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        h1, h2, h3 {
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            animation: fadeInOut 4s ease-in-out alternate;
            margin: 10px 0;
        }

        h1 {
            font-size: 3rem;
            opacity: 0.15;
            animation: fadeInOutOpacicyfree 4s ease-in-out alternate;
        }

        h2 {
            font-size: 2rem;
            font-family: 'MyCustomFont', Arial, sans-serif; /* Применяем кастомный шрифт */
        }

        h3 {
            font-size: 2rem;
            opacity: 0.15;
            animation: fadeInOutOpacicyfree 4s ease-in-out alternate;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes fadeInOutOpacicyfree {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 0.15;
            }
        }
    </style>
</head>
<body>
    <h1>検索</h1>
    <h2>I Love You</h2>
    <h3>番号</h3>
</body>
</html>
