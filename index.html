<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> ? </title>
    <style>
        @font-face {
            font-family: 'MyCustomFont';
            src: url('OMORI_GAME2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .tv-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #noiseCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.08;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            opacity: 0.08;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 2px,
                rgba(0,0,0,0.4) 2px,
                rgba(0,0,0,0.4) 4px
            );
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1, h2, h3 {
            color: white;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.8);
        }

        h1 {
            font-size: 3rem;
            opacity: 0.15;
            animation: fadeInOutOpacicyfree 4s ease-in-out alternate;
            font-family: Arial, sans-serif;
        }

        h2 {
            font-size: 2rem;
            font-family: 'MyCustomFont', Arial, sans-serif;
            animation: fadeInOut 4s ease-in-out alternate;
        }

        h3 {
            font-size: 2rem;
            opacity: 0.15;
            animation: fadeInOutOpacicyfree 4s ease-in-out alternate;
            font-family: Arial, sans-serif;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes fadeInOutOpacicyfree {
            0% { opacity: 0; }
            100% { opacity: 0.15; }
        }
    </style>
</head>
<body>

    <div class="tv-wrapper">
        <canvas id="noiseCanvas"></canvas>
        <div class="scanlines"></div>
        <div class="content">
            <h1>検索</h1>
            <h2>I Love You</h2>
            <h3>番号</h3>
        </div>
    </div>

    <audio id="bgAudio">
        <source src="sound.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('noiseCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgAudio');
        let soundPlayed = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function generateNoise() {
            const w = canvas.width;
            const h = canvas.height;
            const imageData = ctx.createImageData(w, h);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() * 80;
                data[i] = value;
                data[i + 1] = value;
                data[i + 2] = value;
                data[i + 3] = 255;
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function playSoundOnce() {
            if (!soundPlayed) {
                audio.play().catch(err => {
                    console.log('Audio play failed:', err);
                });
                soundPlayed = true;
                // Удаляем обработчики после первого запуска
                document.removeEventListener('click', playSoundOnce);
                document.removeEventListener('touchstart', playSoundOnce);
                document.removeEventListener('keydown', playSoundOnce);
            }
        }

        resizeCanvas();
        generateNoise();

        setInterval(() => {
            generateNoise();
        }, 100);

        window.addEventListener('resize', () => {
            resizeCanvas();
            generateNoise();
        });

       
        document.addEventListener('click', playSoundOnce);
        document.addEventListener('touchstart', playSoundOnce);
        document.addEventListener('keydown', playSoundOnce);

    </script>

</body>
</html>
