<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hello</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .image-link {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 80%;
            max-height: 80%;
            cursor: pointer;
            text-decoration: none;
        }

        .fade-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: fadeInOut 4s ease-in-out infinite alternate;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="image-container">
        <a href="https://icantseeyou.github.io/text.html" class="image-link" target="_blank">
            <img src="vhat.jpg" class="fade-image">
        </a>
    </div>
</body>
</html>
